name: dalys
description: "E-Santé 4.0 - Application de prédiction des maladies respiratoires"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4
  flutter: ">=3.24.4"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Charts et graphiques
  fl_chart: ^0.69.0
  
  # Notifications locales
  flutter_local_notifications: ^17.2.3
  
  # Permissions
  permission_handler: ^12.0.1
  
  # Stockage local
  shared_preferences: ^2.2.2
  
  # Gestion des fuseaux horaires pour les notifications programmées
  timezone: ^0.9.4
  
  # Géolocalisation pour détecter le fuseau horaire
  geolocator: ^13.0.1
  
  # Informations système (pays, langue)
  device_info_plus: ^10.1.2
  
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_blue_plus: ^2.0.2
  sqflite_common_ffi: ^2.3.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  crypto: ^3.0.5
  http: ^1.2.2
  pdf: ^3.11.1
  printing: ^5.13.2
  mailer: ^6.1.0
  
  # Localisation
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/